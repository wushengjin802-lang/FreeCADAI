services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: freecadai-api
    environment:
      FREECADAI_DATABASE_URL: "mysql+pymysql://myroot:hsi!_eTX62028195@119.29.16.170:3306/freecadai?charset=utf8mb4"
      FREECADAI_PLUGIN_API_KEY: dev-plugin-key
      FREECADAI_LLM_BASE_URL: "${FREECADAI_LLM_BASE_URL:-https://api.openai.com/v1}"
      FREECADAI_LLM_API_KEY: "${FREECADAI_LLM_API_KEY:?FREECADAI_LLM_API_KEY is required}"
      FREECADAI_LLM_MODEL: "${FREECADAI_LLM_MODEL:-gpt-4.1-mini}"
      FREECADAI_LLM_TEMPERATURE: "${FREECADAI_LLM_TEMPERATURE:-0.1}"
      FREECADAI_REDIS_URL: "redis://:reDis2029%40hs@119.29.16.170:6379/0"
      FREECADAI_ADMIN_USERNAME: admin
      FREECADAI_ADMIN_PASSWORD: admin@123
    ports:
      - "8000:8000"
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: freecadai-worker
    environment:
      FREECADAI_DATABASE_URL: "mysql+pymysql://myroot:hsi!_eTX62028195@119.29.16.170:3306/freecadai?charset=utf8mb4"
      FREECADAI_PLUGIN_API_KEY: dev-plugin-key
      FREECADAI_LLM_BASE_URL: "${FREECADAI_LLM_BASE_URL:-https://api.openai.com/v1}"
      FREECADAI_LLM_API_KEY: "${FREECADAI_LLM_API_KEY:?FREECADAI_LLM_API_KEY is required}"
      FREECADAI_LLM_MODEL: "${FREECADAI_LLM_MODEL:-gpt-4.1-mini}"
      FREECADAI_LLM_TEMPERATURE: "${FREECADAI_LLM_TEMPERATURE:-0.1}"
      FREECADAI_REDIS_URL: "redis://:reDis2029%40hs@119.29.16.170:6379/0"
      FREECADAI_ADMIN_USERNAME: admin
      FREECADAI_ADMIN_PASSWORD: admin@123
      FREECADAI_AUTO_MIGRATE: "0"
    command: ["python", "-m", "server.app.worker"]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        FREECADAI_API_BASE_URL: http://api:8000
        NEXT_PUBLIC_ASSET_PREFIX: /freecadai
        NEXT_PUBLIC_API_PREFIX: /freecadai
        NEXT_PUBLIC_ROUTE_PREFIX: /freecadai
    container_name: freecadai-web
    depends_on:
      - api
    environment:
      FREECADAI_API_BASE_URL: http://api:8000
      NEXT_PUBLIC_ASSET_PREFIX: /freecadai
      NEXT_PUBLIC_API_PREFIX: /freecadai
      NEXT_PUBLIC_ROUTE_PREFIX: /freecadai
    ports:
      - "3000:3000"
    restart: unless-stopped
