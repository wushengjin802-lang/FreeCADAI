<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FreeCADAI 登录</title>
  <style>
    :root {
      --ink: #17201b;
      --muted: #657169;
      --line: #d8dfd9;
      --paper: #f7f6f1;
      --steel: #344b5a;
      --green: #177245;
      --red: #a23b3b;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 18px;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(52, 75, 90, 0.08) 1px, transparent 1px),
        linear-gradient(180deg, rgba(52, 75, 90, 0.06) 1px, transparent 1px),
        var(--paper);
      background-size: 32px 32px;
      font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 14px;
    }
    .card {
      width: min(420px, 100%);
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 14px 34px rgba(28, 42, 34, 0.1);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { margin: 0 0 20px; color: var(--muted); }
    label { display: block; margin: 14px 0 6px; color: var(--muted); }
    input {
      width: 100%;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 9px 10px;
      font: inherit;
    }
    button {
      width: 100%;
      min-height: 40px;
      margin-top: 18px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--green);
      cursor: pointer;
      font: inherit;
    }
    .msg { min-height: 22px; margin-top: 12px; color: var(--red); }
    .ok { color: var(--green); }
  </style>
</head>
<body>
  <main class="card">
    <h1>FreeCADAI</h1>
    <p>平台管理员登录</p>
    <label for="username">用户名</label>
    <input id="username" value="admin" autocomplete="username" />
    <label for="password">密码</label>
    <input id="password" type="password" autocomplete="current-password" />
    <button id="login">登录</button>
    <div id="message" class="msg"></div>
  </main>
  <script>
    const prefix = location.pathname.split('/login')[0] || '';
    document.getElementById('login').onclick = async () => {
      const message = document.getElementById('message');
      message.textContent = '';
      const response = await fetch(`${prefix}/api/v1/admin/auth/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      if (!response.ok) {
        message.textContent = '用户名或密码不正确。';
        return;
      }
      const data = await response.json();
      localStorage.setItem('freecadai_admin_token', data.token);
      message.className = 'msg ok';
      message.textContent = '登录成功，正在进入后台。';
      location.href = `${prefix}/admin`;
    };
  </script>
</body>
</html>
